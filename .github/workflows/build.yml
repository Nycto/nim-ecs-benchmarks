name: Build

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - run: git submodule update --init
    - uses: iffy/install-nim@v5
      with:
        version: '2.2.10'
    - run: git config --global --add safe.directory "$(pwd)"
    - run: sudo apt-get update
    - run: sudo apt-get install -y clang libcairo2 liblapack3 liblapack-dev libopenblas-dev
    - run: nimble install --depsOnly
    - run: ./run_benchmarks.sh -d:ENTITY_COUNT=10000 -d:SAMPLE=1000
    - run: ./run_benchmarks.sh -d:ENTITY_COUNT=100000 -d:SAMPLE=1000
    - run: ./run_benchmarks.sh -d:ENTITY_COUNT=1000000 -d:SAMPLE=100

    - name: Publish summary
      run: |
        {
          echo '### Benchmark results'
          echo ''
          echo '```'
          cat site/summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          site/
          *.csv

    - name: Package the site for Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
